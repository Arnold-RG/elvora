# Render Blueprint for the Elvora web app preview (branch rebuild/elvora-app).
# Mirrors the two services that already exist (elvora-app-preview, elvora-api-preview) and adds the HTTP
# security headers for the static app. To apply it, link this file as a Blueprint in Render and choose
# "adopt existing resources". Env vars are sync:false (values never stored here, current values kept) or generated by Render.
services:
  - type: web
    runtime: static
    name: elvora-app-preview
    repo: https://github.com/Arnold-RG/elvora
    branch: rebuild/elvora-app
    buildCommand: echo 'static app, no build step'
    staticPublishPath: app
    autoDeployTrigger: commit
    previews:
      generation: "off"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://elvora-api-preview.onrender.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=(self), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /sw.js
        name: Cache-Control
        value: no-cache

  - type: web
    runtime: python
    name: elvora-api-preview
    repo: https://github.com/Arnold-RG/elvora
    branch: rebuild/elvora-app
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    previews:
      generation: "off"
    buildCommand: pip install -r api/requirements.txt
    # proxy headers are handled in the app (CF-Connecting-IP / rightmost public X-Forwarded-For), never trusted from the client
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --no-server-header
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # sync: false = keep the value already set on the service; the Blueprint never overwrites or stores it
      - key: PYTHON_VERSION
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # HMAC secret for the app's short-lived session tokens; Render generates it once and keeps it
      - key: ELVORA_SESSION_SECRET
        generateValue: true
